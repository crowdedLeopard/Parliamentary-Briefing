name: Daily parliamentary briefing

on:
  schedule:
    # 04:32 UK time every day, so the briefing is built and validated before the page refresh
    # just before 06:00. GitHub cron is UTC, so fire at both 03:32 and 04:32 UTC; the script
    # runs only on the one that falls at 04:xx London time (GMT or BST).
    - cron: "32 3 * * *"
    - cron: "32 4 * * *"
  workflow_dispatch:
    inputs:
      run_date:
        description: "Briefing date (YYYY-MM-DD, UK). Blank = today. Covers the previous working day."
        required: false
      mode:
        description: "full = fetch, write, validate, render; validate = re-check the saved editorial; render = re-render only"
        type: choice
        options: [full, validate, render]
        default: full

permissions:
  contents: write
  copilot-requests: write   # lets the Copilot CLI use this run's GITHUB_TOKEN (billed to the owner's Copilot seat)

concurrency:
  group: daily-briefing
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      ran: ${{ steps.run.outputs.ran }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the GitHub Copilot CLI
        run: npm install -g @github/copilot && copilot --version
      - name: Check the writer and validator models answer
        # Models come from GitHub Copilot. Auth: the COPILOT_GITHUB_TOKEN secret (fine-grained PAT with the
        # "Copilot Requests" permission) if set, otherwise this run's GITHUB_TOKEN.
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          MODEL_PROVIDER: ${{ vars.MODEL_PROVIDER }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WRITER_MODEL: ${{ vars.WRITER_MODEL }}
          VALIDATOR_MODEL: ${{ vars.VALIDATOR_MODEL }}
          CLASSIFIER_MODEL: ${{ vars.CLASSIFIER_MODEL }}
        run: |
          [ -z "$COPILOT_GITHUB_TOKEN" ] && unset COPILOT_GITHUB_TOKEN
          for v in MODEL_PROVIDER WRITER_MODEL VALIDATOR_MODEL CLASSIFIER_MODEL; do [ -z "${!v}" ] && unset $v; done
          if ! python pipeline/llm.py; then
            echo "::error title=Validator cannot run::GitHub Copilot did not answer for the writer or validator model (see the log above). Add a COPILOT_GITHUB_TOKEN secret: a fine-grained personal access token with the Copilot Requests permission, from an account with a Copilot seat. Without it the briefing is published as NOT VALIDATED."
          fi
      - name: Fetch, screen, profile, write, validate and render
        id: run
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          MODEL_PROVIDER: ${{ vars.MODEL_PROVIDER }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WRITER_MODEL: ${{ vars.WRITER_MODEL }}
          VALIDATOR_MODEL: ${{ vars.VALIDATOR_MODEL }}
          CLASSIFIER_MODEL: ${{ vars.CLASSIFIER_MODEL }}
          RUN_DATE: ${{ inputs.run_date }}
          MODE: ${{ inputs.mode }}
          EVENT: ${{ github.event_name }}
        run: |
          ARGS=()
          if [ "$EVENT" = "schedule" ]; then ARGS+=(--scheduled); fi
          if [[ "$RUN_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then ARGS+=(--run-date "$RUN_DATE"); fi
          if [[ "$MODE" =~ ^(full|validate|render)$ ]]; then ARGS+=(--mode "$MODE"); fi
          [ -z "$COPILOT_GITHUB_TOKEN" ] && unset COPILOT_GITHUB_TOKEN
          for v in MODEL_PROVIDER WRITER_MODEL VALIDATOR_MODEL CLASSIFIER_MODEL; do [ -z "${!v}" ] && unset $v; done
          set +e
          python pipeline/run.py "${ARGS[@]}"
          code=$?
          set -e
          if git status --porcelain reports | grep -q .; then echo "ran=true" >> "$GITHUB_OUTPUT"; fi
          if [ $code -eq 2 ]; then echo "::error title=Briefing not validated::The validator did not pass this edition. It is published marked NOT VALIDATED; see the coverage note."; fi
          exit $code
      - name: Print the reading edition to PDF (for OneDrive and email)
        if: always()
        run: |
          pip install -q playwright
          python -m playwright install --with-deps chromium > /dev/null
          python pipeline/pdf.py || echo "::warning::PDF step failed"
      - name: Commit results
        if: always()
        run: |
          git config user.name "briefing-bot"
          git config user.email "briefing-bot@users.noreply.github.com"
          git add data reports editorial || true
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Briefing for $(date -u +%Y-%m-%d)"
          git pull --rebase --quiet
          git push
      - name: Keep the report as a downloadable artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: briefing
          path: |
            reports/*.html
            editorial/*.json
          if-no-files-found: ignore
          retention-days: 30

  site:
    # Publishes the website on public GitHub Pages (anyone with the link; pages carry noindex so search
    # engines skip them). Needs Settings > Pages > Source = "GitHub Actions" once. Set the repository
    # variable PAGES_DISABLED=true to stop publishing. Azure Static Web Apps (sign-in required) also
    # deploys if the AZURE_STATIC_WEB_APPS_API_TOKEN secret exists.
    needs: build
    if: always() && (needs.build.outputs.ran == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    env:
      SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
      PAGES_OFF: ${{ vars.PAGES_DISABLED }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python pipeline/site.py
      - name: Deploy to Azure Static Web Apps (Microsoft sign-in, invited users only)
        if: env.SWA_TOKEN != ''
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: _site
          skip_app_build: true
          skip_api_build: true
      - name: Set up GitHub Pages
        if: env.PAGES_OFF != 'true'
        uses: actions/configure-pages@v5
      - name: Upload for GitHub Pages
        if: env.PAGES_OFF != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        if: env.PAGES_OFF != 'true'
        id: pages
        uses: actions/deploy-pages@v4
      - name: Say where the site is
        if: env.PAGES_OFF != 'true'
        run: echo "::notice title=Briefing website::${{ steps.pages.outputs.page_url }}"
