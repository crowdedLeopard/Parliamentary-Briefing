name: Daily parliamentary briefing

on:
  schedule:
    # Every 30 minutes, all day. GitHub's scheduler is best effort: on 25 Nov 2026 it dropped the
    # early slots and started runs 9-10 hours late, so slots run round the clock and any one that
    # does start builds the edition. Each run starts with the cheap "gate" job (pipeline/gate.py):
    # it does nothing before 04:15 UK or once today's edition exists, and otherwise builds only
    # when the material (Hansard for every day a House sat, written questions) is published.
    # Until 05:00 UK it waits for missing material; after that it builds with what there is and
    # names the gap. Days when Parliament did not sit get a short edition saying so.
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      run_date:
        description: "Briefing date (YYYY-MM-DD, UK). Blank = today. Covers the previous working day."
        required: false
      mode:
        description: "full = fetch, write, validate, render; validate = re-check the saved editorial; render = re-render only"
        type: choice
        options: [full, validate, render]
        default: full
      backstop:
        description: "Started by a backup check: apply the same checks as a scheduled run (skip if the edition exists, check the material is published)"
        type: boolean
        default: false

permissions:
  contents: write
  copilot-requests: write   # lets the Copilot CLI use this run's GITHUB_TOKEN (billed to the owner's Copilot seat)

concurrency:
  group: daily-briefing
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      build: ${{ steps.gate.outputs.build }}
      alert: ${{ steps.gate.outputs.alert }}
      edition: ${{ steps.gate.outputs.edition }}
      reason: ${{ steps.gate.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # the newest main, so a run that waited in the queue sees an edition built meanwhile
      - name: Is today's edition missing, and is the material published?
        id: gate
        env:
          EVENT: ${{ inputs.backstop && 'schedule' || github.event_name }}
          RUN_DATE: ${{ inputs.run_date }}
        run: |
          ARGS=(--event "$EVENT")
          if [[ "$RUN_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then ARGS+=(--run-date "$RUN_DATE"); fi
          python3 pipeline/gate.py "${ARGS[@]}"

  build:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      ran: ${{ steps.run.outputs.ran }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # a queued run must see any edition committed since it was triggered
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the GitHub Copilot CLI
        run: npm install -g @github/copilot && copilot --version
      - name: Check the writer and validator models answer
        # Models come from GitHub Copilot. Auth: the COPILOT_GITHUB_TOKEN secret (fine-grained PAT with the
        # "Copilot Requests" permission) if set, otherwise this run's GITHUB_TOKEN.
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          MODEL_PROVIDER: ${{ vars.MODEL_PROVIDER }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WRITER_MODEL: ${{ vars.WRITER_MODEL }}
          VALIDATOR_MODEL: ${{ vars.VALIDATOR_MODEL }}
          CLASSIFIER_MODEL: ${{ vars.CLASSIFIER_MODEL }}
        run: |
          [ -z "$COPILOT_GITHUB_TOKEN" ] && unset COPILOT_GITHUB_TOKEN
          for v in MODEL_PROVIDER WRITER_MODEL VALIDATOR_MODEL CLASSIFIER_MODEL; do [ -z "${!v}" ] && unset $v; done
          if ! python pipeline/llm.py; then
            echo "::error title=Validator cannot run::GitHub Copilot did not answer for the writer or validator model (see the log above). Add a COPILOT_GITHUB_TOKEN secret: a fine-grained personal access token with the Copilot Requests permission, from an account with a Copilot seat. Without it the briefing is published as NOT VALIDATED."
          fi
      - name: Fetch, screen, profile, write, validate and render
        id: run
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          MODEL_PROVIDER: ${{ vars.MODEL_PROVIDER }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WRITER_MODEL: ${{ vars.WRITER_MODEL }}
          VALIDATOR_MODEL: ${{ vars.VALIDATOR_MODEL }}
          CLASSIFIER_MODEL: ${{ vars.CLASSIFIER_MODEL }}
          RUN_DATE: ${{ inputs.run_date }}
          MODE: ${{ inputs.mode }}
        run: |
          ARGS=()
          if [[ "$RUN_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then ARGS+=(--run-date "$RUN_DATE"); fi
          if [[ "$MODE" =~ ^(full|validate|render)$ ]]; then ARGS+=(--mode "$MODE"); fi
          [ -z "$COPILOT_GITHUB_TOKEN" ] && unset COPILOT_GITHUB_TOKEN
          for v in MODEL_PROVIDER WRITER_MODEL VALIDATOR_MODEL CLASSIFIER_MODEL; do [ -z "${!v}" ] && unset $v; done
          set +e
          python pipeline/run.py "${ARGS[@]}"
          code=$?
          set -e
          if git status --porcelain reports | grep -q .; then echo "ran=true" >> "$GITHUB_OUTPUT"; fi
          if [ $code -eq 2 ]; then echo "::error title=Briefing not validated::The validator did not pass this edition. It is published marked NOT VALIDATED; see the coverage note."; fi
          exit $code
      - name: Print the reading edition to PDF (for OneDrive and email)
        if: always()
        run: |
          pip install -q playwright
          python -m playwright install --with-deps chromium > /dev/null
          python pipeline/pdf.py || echo "::warning::PDF step failed"
      - name: Commit results
        if: always()
        run: |
          git config user.name "briefing-bot"
          git config user.email "briefing-bot@users.noreply.github.com"
          git add data reports editorial || true
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Briefing edition ${{ needs.gate.outputs.edition }} (built $(date -u +%Y-%m-%d))"
          git pull --rebase --quiet -X theirs   # generated files: this run's version wins on conflict
          git push
      - name: Keep the report as a downloadable artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: briefing
          path: |
            reports/*.html
            editorial/*.json
          if-no-files-found: ignore
          retention-days: 30

  alert:
    # Opens (or adds to) a GitHub issue when a scheduled build fails or is not validated, or when the
    # edition is still missing at 09:00 UK, so a missed edition is never silent. GitHub emails the
    # repo owner about new issues and comments.
    needs: [gate, build]
    if: always() && (github.event_name == 'schedule' || inputs.backstop) && (needs.build.result == 'failure' || needs.gate.outputs.alert == 'true' || needs.gate.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EDITION: ${{ needs.gate.outputs.edition }}
          REASON: ${{ needs.gate.outputs.reason }}
          BUILD: ${{ needs.build.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Briefing edition ${EDITION:-unknown} needs attention"
          body="Scheduled run: $RUN_URL
          Build job: $BUILD
          Gate: $REASON"
          n=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -z "$n" ]; then gh issue create --title "$title" --body "$body"
          elif [ "$BUILD" = "failure" ]; then gh issue comment "$n" --body "$body"   # one email per failed build, not per slot
          fi

  site:
    # Publishes the website (latest briefing + archive). Pages carry noindex and robots.txt blocks crawlers.
    #   Public site (default): pushes only the built website to a separate PUBLIC repo, served by GitHub Pages
    #     from its main branch. Needs the SITE_DEPLOY_TOKEN secret: a fine-grained token with Contents
    #     read/write on that repo only. Repo name: variable SITE_REPO, default crowdedLeopard/parliamentary-briefing-site.
    #   Pages in this repo (default when SITE_DEPLOY_TOKEN is not set): needs Settings > Pages > Source =
    #     GitHub Actions, and the repo public (or a paid plan). Variable PAGES_DISABLED=true turns it off.
    #   Azure Static Web Apps (sign-in required): if the AZURE_STATIC_WEB_APPS_API_TOKEN secret exists.
    needs: build
    if: always() && (needs.build.outputs.ran == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    env:
      SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
      SITE_TOKEN: ${{ secrets.SITE_DEPLOY_TOKEN }}
      SITE_REPO: ${{ vars.SITE_REPO || 'crowdedLeopard/parliamentary-briefing-site' }}
      REDACT_TERMS: ${{ vars.REDACT_TERMS }}   # extra internal names kept off the pages (pipeline/redact.py)
      PAGES_OFF: ${{ vars.PAGES_DISABLED }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python pipeline/site.py
      - name: Publish to the public site repo
        if: env.SITE_TOKEN != ''
        run: |
          set -euo pipefail
          if ! [[ "$SITE_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then echo "::error::Bad SITE_REPO"; exit 1; fi
          git clone --depth 1 "https://x-access-token:${SITE_TOKEN}@github.com/${SITE_REPO}.git" pub 2>&1 | sed "s/${SITE_TOKEN}/***/g"
          find pub -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a _site/. pub/
          rm -f pub/staticwebapp.config.json pub/403.html
          cd pub
          git config user.name "briefing-bot"
          git config user.email "briefing-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Site unchanged"; exit 0; fi
          git commit -qm "Briefing site $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q origin HEAD:main
          owner="${SITE_REPO%%/*}"; name="${SITE_REPO#*/}"
          echo "::notice title=Briefing website::https://${owner,,}.github.io/${name}/"
      - name: Deploy to Azure Static Web Apps (Microsoft sign-in, invited users only)
        if: env.SWA_TOKEN != ''
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: _site
          skip_app_build: true
          skip_api_build: true
      - name: Set up GitHub Pages in this repo
        if: env.SITE_TOKEN == '' && env.PAGES_OFF != 'true'
        uses: actions/configure-pages@v5
      - name: Upload for GitHub Pages in this repo
        if: env.SITE_TOKEN == '' && env.PAGES_OFF != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy GitHub Pages in this repo
        if: env.SITE_TOKEN == '' && env.PAGES_OFF != 'true'
        id: pages
        uses: actions/deploy-pages@v4
      - name: Say where the site is
        if: env.SITE_TOKEN == '' && env.PAGES_OFF != 'true'
        run: echo "::notice title=Briefing website::${{ steps.pages.outputs.page_url }}"
