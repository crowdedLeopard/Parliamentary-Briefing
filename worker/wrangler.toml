# Regenerate service for the briefing site. Deployed by .github/workflows/deploy-worker.yml,
# which fills in the KV namespace id and copies the secrets in. See README.md.
name = "briefing-regen"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true

[[kv_namespaces]]
binding = "REGEN"
id = "__KV_ID__"

# Mail for the optional six-digit codes (Cloudflare Email Sending): deploy-worker.yml adds the
# [[send_email]] binding named EMAIL when the repository variable REGEN_EMAIL_FROM is set.

[vars]
GITHUB_REPO = "crowdedLeopard/Parliamentary-Briefing"
SITE_URL = "https://crowdedleopard.github.io/Parliamentary-Briefing/"
DAILY_CAP = "10"          # rewrites across all readers per day (UTC)
LIMIT_SCOPE = "edition"   # "edition": one rewrite per person per edition; "ever": one per person in total
RESULT_DAYS = "14"        # how long a rewrite stays viewable
